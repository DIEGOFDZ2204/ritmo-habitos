name: Crear APK para Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap add android
      - run: pnpm exec cap sync android
      - name: Compilar APK instalable
        run: cd android && ./gradlew assembleDebug
      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: Ritmo ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

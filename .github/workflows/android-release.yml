name: Crear APK para Android

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-apk:
    # Build on version tags, manual dispatches, or an explicitly marked main commit.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build-apk]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap add android
      - run: pnpm exec cap sync android
      - name: Evitar que la barra de estado cubra la app en Android 15
        run: |
          mkdir -p android/app/src/main/res/values-v35
          cat > android/app/src/main/res/values-v35/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar">
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch">
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
              </style>
          </resources>
          EOF
      - name: Seleccionar etiqueta de versión
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "tag=v1.2.0" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar APK instalable
        run: cd android && ./gradlew assembleDebug
      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Ritmo ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

